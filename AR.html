<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MindAR Loader</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

#loading{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    z-index:9999;
}

a-scene{
    display:none;
}
</style>
</head>

<body>

<div id="loading">
読み込み中...
</div>

<a-scene
id="scene"
mindar-image="imageTargetSrc: ./target.mind;"
color-space="sRGB"
renderer="colorManagement:true; physicallyCorrectLights:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>
    <a-asset-item id="model" src="./xxx.glb"></a-asset-item>
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0">
    <a-gltf-model
        id="gltf"
        src="#model"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.2 0.2 0.2">
    </a-gltf-model>
</a-entity>

</a-scene>

<script>

const scene = document.getElementById("scene");
const loading = document.getElementById("loading");
const model = document.getElementById("gltf");

let mindLoaded = false;
let modelLoaded = false;

function checkReady(){
    if(mindLoaded && modelLoaded){
        loading.style.display="none";
        scene.style.display="block";
        console.log("すべて読み込み完了");
    }
}

// target.mindの読み込み完了
scene.addEventListener("renderstart",()=>{
    mindLoaded=true;
    checkReady();
});

// glbの読み込み完了
model.addEventListener("model-loaded",()=>{
    modelLoaded=true;
    checkReady();
});

// エラー
model.addEventListener("model-error",()=>{
    loading.innerHTML="GLBの読み込みに失敗しました";
});

</script>

</body>
</html>
